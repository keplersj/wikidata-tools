# Cloudflare Workers with static assets. NOT DEPLOYED: deploying and the DNS record
# for wikidata.keplersj.com both wait on the owner's go-ahead (see NOTES.md).
name = "wikidata-tools"
main = "worker/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only /api/* hits the Worker; everything else is served straight from the assets.
run_worker_first = ["/api/*"]

# Custom domain: wrangler creates the DNS record on deploy, which is why it waits for approval.
[[routes]]
pattern = "wikidata.keplersj.com"
custom_domain = true
