# Cloudflare Workers, static assets only (no Worker code: every source answers CORS, so no proxy).
# NOT DEPLOYED: deploying and the DNS record for wikidata.keplersj.com both wait on the owner's
# go-ahead (see NOTES.md).
name = "wikidata-tools"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Custom domain: wrangler creates the DNS record on deploy, which is why it waits for approval.
[[routes]]
pattern = "wikidata.keplersj.com"
custom_domain = true
